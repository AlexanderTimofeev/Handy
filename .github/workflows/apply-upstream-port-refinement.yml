name: Apply upstream port refinement

on:
  pull_request:
    branches:
      - integration/upstream-0.9.4

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target port branch
        uses: actions/checkout@v5
        with:
          ref: agent/port-custom-providers
          fetch-depth: 0

      - name: Load refinement script from helper branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/upstream-port
          git show origin/agent/upstream-port:scripts/refine-upstream-port.py > /tmp/refine-upstream-port.py

      - name: Apply refinement and push target branch
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/refine-upstream-port.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Target branch already refined."
            exit 0
          fi

          git commit -m "refactor: narrow and harden upstream provider port"
          git push origin HEAD:agent/port-custom-providers
