name: Apply post-port cleanup

on:
  push:
    branches:
      - agent/port-custom-providers

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/port-custom-providers
          fetch-depth: 0

      - name: Remove stale translation keys and temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/i18n/locales/en/translation.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          bindings = data['settings']['general']['shortcut']['bindings']
          bindings.pop('paste_last_transcript', None)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/validate-upstream-port.yml
          rm -f .github/workflows/fix-port-cleanup.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align upstream translations after port"
          git push origin HEAD:agent/port-custom-providers
