name: Format upstream port branches

on:
  pull_request:
    branches:
      - integration/upstream-0.9.4

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v5
        with:
          ref: agent/upstream-port
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Format upstream baseline file
        shell: bash
        run: |
          set -euo pipefail
          git checkout integration/upstream-0.9.4
          bun install --frozen-lockfile
          bun x prettier --write src/components/ui/Slider.tsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/Slider.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format upstream slider component"
            git push origin HEAD:integration/upstream-0.9.4
          fi

      - name: Format product port files
        shell: bash
        run: |
          set -euo pipefail
          git checkout agent/port-custom-providers
          bun install --frozen-lockfile
          bun x prettier --write src/components/onboarding/ModelCard.tsx
          (cd src-tauri && cargo fmt)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/onboarding/ModelCard.tsx src-tauri/src
          if ! git diff --cached --quiet; then
            git commit -m "style: format upstream provider port"
            git push origin HEAD:agent/port-custom-providers
          fi
