name: Port custom changes onto upstream

on:
  push:
    branches:
      - agent/port-custom-providers

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean upstream port branch
        uses: actions/checkout@v5
        with:
          ref: agent/port-custom-providers
          fetch-depth: 0

      - name: Cherry-pick tested custom commits in order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex-groq-api

          # The custom branch was created from this fork's v0.9.2 + installer
          # commit. Exclude merge commits: their individual commits are already
          # included, which preserves the logical implementation history.
          mapfile -t commits < <(
            git rev-list --reverse --topo-order --no-merges \
              021a87741d90e52bfe4c8014a4cfe909b04565ae..origin/codex-groq-api
          )

          printf 'Porting %s commits:\n' "${#commits[@]}"
          git log --oneline --no-walk "${commits[@]}"

          for commit in "${commits[@]}"; do
            echo "::group::Cherry-pick $commit"
            if git cherry-pick -X theirs "$commit"; then
              echo "::endgroup::"
              continue
            fi

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if (( ${#conflicts[@]} > 0 )); then
              printf 'Resolving remaining conflict paths from the tested custom side:\n%s\n' "${conflicts[*]}"
              for path in "${conflicts[@]}"; do
                git checkout --theirs -- "$path"
                git add -- "$path"
              done
              git add -A
              GIT_EDITOR=true git cherry-pick --continue
            elif git diff --quiet && git diff --cached --quiet; then
              echo "Commit is already represented upstream; skipping it."
              git cherry-pick --skip
            else
              git status --short
              exit 1
            fi
            echo "::endgroup::"
          done

          git push origin HEAD:agent/port-custom-providers

      - name: Show resulting custom diff
        shell: bash
        run: |
          git diff --stat integration/upstream-0.9.4...HEAD
          git log --oneline --decorate integration/upstream-0.9.4..HEAD
