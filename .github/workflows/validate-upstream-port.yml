name: Validate upstream port

on:
  pull_request:
    branches:
      - integration/upstream-0.9.4

permissions:
  contents: read

jobs:
  windows-build:
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: --debug
      upload-artifacts: false
      sign-binaries: false
      repository: AlexanderTimofeev/Handy
      ref: ${{ github.event.pull_request.head.sha }}
      is-debug-build: true
      no-cache: false
    secrets: inherit
